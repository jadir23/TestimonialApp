name: testimonialapp

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
      POSTGRES_USER: ${POSTGRES_USER:-odoo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-odoo} -d ${POSTGRES_DB:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  odoo:
    image: odoo:18
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    # No host port: Odoo is only reachable from the frontend container.
    expose:
      - "8069"
    environment:
      HOST: db
      USER: ${POSTGRES_USER:-odoo}
      PASSWORD: ${POSTGRES_PASSWORD}
      ODOO_ADMIN_PASSWD: ${ODOO_ADMIN_PASSWD:-}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_PRICE_PRO: ${STRIPE_PRICE_PRO:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-http://localhost:4321}
    volumes:
      - ./backend/addons:/mnt/extra-addons
      - ./backend/odoo.conf:/etc/odoo/odoo.conf:ro
      - odoo-data:/var/lib/odoo

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - odoo
    ports:
      # Reachable by IP: http://<server-ip>:4321
      - "0.0.0.0:4321:4321"
    environment:
      ODOO_URL: ${ODOO_URL:-http://odoo:8069}
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-http://localhost:4321}
      PORT: "4321"
      HOST: "0.0.0.0"

volumes:
  pgdata:
  odoo-data: