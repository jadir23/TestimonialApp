[options]
addons_path = /mnt/extra-addons
data_dir = /var/lib/odoo
; Pin the database: the default dbfilter matches the Host header against the
; db name, and requests arrive with Host "odoo:8069" / an external IP, so
; without this Odoo serves DB-less routes and every /api/* call 404s.
db_name = postgres
; Allow the public user (used by the JSON API) a session without a login.
list_db = False
; db_host / db_user / db_password / db_port are intentionally omitted:
; the odoo image entrypoint injects them from HOST/USER/PASSWORD/PORT env
; (compose -> POSTGRES_*), and setting them here would override that.